name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APK (optimized, debug-signed)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee build.log || {
            # Surface compiler errors as annotations so they show up on the run page.
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: gallery-release-apk
          path: app/build/outputs/apk/release/*.apk
